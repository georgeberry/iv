[project]
name = "invalidator"
version = "0.1.0"
description = "Re-run a step only when something upstream actually changed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The default fingerprint strategy hashes the DATA, not the bytes, so it needs a
# dataframe library. Everything else in the core is stdlib.
data = ["polars>=1.0"]
cli = ["typer>=0.12"]
viz = ["networkx>=3.0", "matplotlib>=3.8"]
dev = ["polars>=1.0", "typer>=0.12", "networkx>=3.0", "matplotlib>=3.8", "pytest>=8.0"]

[project.scripts]
# `iv` is the command. It matches what the instance is conventionally called in code,
# and it is what you actually type twenty times an hour.
iv = "invalidator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invalidator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
