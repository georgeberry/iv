[project]
name = "iv"
version = "2.0.0"
description = "Re-run a step only when something upstream actually changed"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
lint = [
    "pyflakes>=3",
]
# The default fingerprint strategy hashes the DATA, not the bytes, so it needs a
# dataframe library. Everything else in the core is stdlib.
data = ["polars>=1.0"]
cli = ["typer>=0.12"]
viz = ["networkx>=3.0", "matplotlib>=3.8"]
dev = ["polars>=1.0", "typer>=0.12", "networkx>=3.0", "matplotlib>=3.8",
       "pytest>=8.0", "cloudpathlib>=0.18", "pyflakes>=3"]

[project.scripts]
# `iv` is the command. It matches what the instance is conventionally called in code,
# and it is what you actually type twenty times an hour.
iv = "iv.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Five tests reuse `run` from `tests.test_partition` rather than copying a helper that
# would then drift. That import needs the project root importable, which pytest does not
# do on its own once `tests/` has no `__init__.py` — and it should not have one, because a
# package there changes how conftest is resolved.
pythonpath = ["."]
