[project]
name = "iv"
version = "2.0.0"
description = "Re-run a step only when something upstream actually changed"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cloudpathlib[gs]>=0.18",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "polars>=1.0",
    "pyflakes>=3",
    "pytest>=8.0",
    "typer>=0.12",
]

[project.scripts]
iv = "iv.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
